# Clave única y metadatos del proyecto
sonar.projectKey=espocrm_VyV
sonar.projectName=EspoCRM VyV
sonar.projectVersion=1.0
sonar.scm.disabled=true

# Incluir código propio de VyV y personalizaciones
sonar.sources=application/Espo/VyV,custom
sonar.sourceEncoding=UTF-8

# Directorios de tests propios del proyecto VyV
sonar.tests=tests/unit/Espo/VyV,cypress/e2e
sonar.test.inclusions=tests/unit/Espo/VyV/**,cypress/e2e/**

# Exclusiones globales
sonar.exclusions=vendor/**,node_modules/**,tests/integration/**,tests/unit/Espo/Core/**,tests/unit/Espo/ORM/**,cypress/**,data/**,cache/**,**/*.min.js,client/lib/**

# Cobertura y reportes de pruebas PHP (PHPUnit)
sonar.php.coverage.reportPaths=coverage/phpunit-coverage.xml
sonar.php.tests.reportPath=coverage/phpunit-junit.xml

# Reportes de ejecución de pruebas Cypress (Generic Test Execution format)
sonar.testExecutionReportPaths=cypress/reports/junit-dummy.xml

